name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  relay:
    name: Relay Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.84.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy check
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace --all-targets
      - name: Cargo deny check
        uses: EmbarkStudios/cargo-deny-action@v2

  web-ui:
    name: Web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install UI dependencies
        run: npm ci --prefix apps/web
      - name: Check npm licenses
        run: node scripts/check-npm-licenses.mjs
      - name: Build Web UI
        run: npm run build --prefix apps/web
      - name: UI Unit & Integration Tests
        run: npm test --prefix apps/web

  e2e:
    name: Web + Core E2E Tests
    runs-on: ubuntu-latest
    needs: [relay, web-ui]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install UI dependencies
        run: npm ci --prefix apps/web
      - name: Install Playwright browsers
        run: npx --prefix apps/web playwright install --with-deps chromium webkit
      - name: Download Core daemon from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p bin
          gh release download v0.0.1-import --repo ForkHorizon/Shardrail_Core --pattern 'shardraild*' --dir bin || true
          if [ -f bin/shardraild ]; then
            chmod +x bin/shardraild
            echo "SHARDRAILD_BIN=$GITHUB_WORKSPACE/bin/shardraild" >> $GITHUB_ENV
          else
            echo "Pre-built daemon not available for this runner arch; skipping release daemon E2E or will compile if needed"
          fi
      - name: Run E2E test suite
        if: env.SHARDRAILD_BIN != ''
        run: npm --prefix apps/web run test:e2e
      - name: Check daemon test orphans
        if: always()
        run: ./scripts/check-daemon-test-orphans.sh
