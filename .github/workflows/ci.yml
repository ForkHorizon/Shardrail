name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
      - uses: EmbarkStudios/cargo-deny-action@v2
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/contracts/package-lock.json
            packages/client/package-lock.json
      - run: npm ci --prefix packages/contracts
      - run: npm ci --prefix packages/client
      - run: npm audit signatures --prefix packages/contracts
      - run: npm audit signatures --prefix packages/client
      - run: node scripts/check-npm-licenses.mjs
      - run: cargo build --bin shardraild --bin shardrail-fake-acp
      - run: npm run typecheck --prefix packages/client
      - run: npm test --prefix packages/client
      - run: scripts/check-schema-drift.sh
